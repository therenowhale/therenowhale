<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="375" viewBox="0 0 1200 375"><rect width="1200" height="375" fill="#183729"/><text x="40" y="38" fill="#F4F0E6" font-size="15" font-family="Arial, Helvetica, sans-serif" letter-spacing="2">02 / HOW I LEARN</text><text x="40" y="119" fill="#FF4D00" font-size="51" font-family="Georgia, Times New Roman, serif" >Understanding is earned by doing.</text><text x="40" y="188" fill="#FF4D00" font-size="16" font-family="Arial, Helvetica, sans-serif" >01</text><text x="40" y="236" fill="#F4F0E6" font-size="35" font-family="Arial, Helvetica, sans-serif" >Build</text><text x="40" y="279" fill="#F4F0E6" font-size="19" font-family="Arial, Helvetica, sans-serif" >Start with a real experiment.</text><text x="370" y="236" fill="#FF4D00" font-size="30" font-family="Arial, Helvetica, sans-serif" >→</text><text x="430" y="188" fill="#FF4D00" font-size="16" font-family="Arial, Helvetica, sans-serif" >02</text><text x="430" y="236" fill="#F4F0E6" font-size="35" font-family="Arial, Helvetica, sans-serif" >Observe</text><text x="430" y="279" fill="#F4F0E6" font-size="19" font-family="Arial, Helvetica, sans-serif" >Look at what actually happens.</text><text x="760" y="236" fill="#FF4D00" font-size="30" font-family="Arial, Helvetica, sans-serif" >→</text><text x="820" y="188" fill="#FF4D00" font-size="16" font-family="Arial, Helvetica, sans-serif" >03</text><text x="820" y="236" fill="#F4F0E6" font-size="35" font-family="Arial, Helvetica, sans-serif" >Explain</text><text x="820" y="279" fill="#F4F0E6" font-size="19" font-family="Arial, Helvetica, sans-serif" >Understand why it works.</text><text x="40" y="338" fill="#F4F0E6" font-size="14" font-family="Arial, Helvetica, sans-serif" letter-spacing="2">QUESTION ASSUMPTIONS. SHARE THE PROCESS.</text></svg>
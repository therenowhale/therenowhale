<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="295" viewBox="0 0 1200 295"><rect width="1200" height="295" fill="#11120F"/><text x="40" y="40" fill="#F4F0E6" font-size="15" font-family="Arial, Helvetica, sans-serif" letter-spacing="2">04 / THE PRINCIPLE</text><text x="40" y="120" fill="#FF4D00" font-size="64" font-family="Georgia, Times New Roman, serif" >No single authority.</text><text x="40" y="191" fill="#F4F0E6" font-size="64" font-family="Georgia, Times New Roman, serif" >Keep asking why.</text><text x="40" y="252" fill="#F4F0E6" font-size="21" font-family="Arial, Helvetica, sans-serif" >Experiment. Read the source. Form your own understanding.</text></svg>